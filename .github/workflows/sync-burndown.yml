name: Sync Sprint 1 Burndown

on:
  schedule:
    # Hourly at minute 17 (UTC); GitHub may delay scheduled runs.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-burndown
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Projects credential
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Add repository Actions secret PROJECTS_READ_TOKEN with read access to phangsx25 project 1. See docs/BURNDOWN_SYNC.md.'
            exit 1
          fi
          # Check the actual credential without printing its value or user data.
          if ! gh api user --silent; then
            echo '::error::PROJECTS_READ_TOKEN could not authenticate. Check that its Secret value is a complete, active personal access token, not the token name.'
            exit 1
          fi
          if ! project_id=$(gh api graphql -f query='query { user(login: "phangsx25") { projectV2(number: 1) { id } } }' --jq '.data.user.projectV2.id'); then
            echo '::error::Token authenticated but could not read Project 1. Check the classic token read:project scope and access to the Project owner.'
            exit 1
          fi
          if [ -z "$project_id" ] || [ "$project_id" = 'null' ]; then
            echo '::error::Token authenticated but Project 1 is not accessible.'
            exit 1
          fi
      - name: Read board and update burndown
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_READ_TOKEN }}
        run: node scripts/update-burndown.mjs
      - name: Commit changed snapshots
        run: |
          git add docs/sprint-1/sprint1-burndown.json docs/sprint-1/sprint1-burndown.md docs/sprint-1/sprint1-burndown.svg
          if git diff --cached --quiet; then
            echo 'Snapshots unchanged.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: sync Sprint 1 burndown'
          git push origin HEAD:${{ github.event.repository.default_branch }}
